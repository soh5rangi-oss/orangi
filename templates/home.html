{% extends "base.html" %}

{% block title %}홈{% endblock %}

{% block content %}
<div class="home-topbar">
    <div class="icons">
        <a href="{{ url_for('notifications') }}">🔔</a>
    </div>
    <div class="user">👤 {{ user_name }}</div>
</div>

<div class="status-card">
    <div class="status-label">현재 수면 상태</div>
    <div class="status-row">
        <div class="temp">
            🌡️ <span id="home-temp-value">{{ temp }}</span><span class="unit">℃</span>
        </div>
        <div class="risk">
            🌙👶
            <div class="risk-label">
                <span class="dot {{ risk_level }}" id="home-risk-dot"></span> 위험도 : <span id="home-risk-text">{{ risk_text }}</span>
            </div>
        </div>
    </div>
</div>

<div class="ai-note">{{ llm }}</div>
  

<div class="menu-title">Menu</div>
<div class="menu-grid">
    <a class="menu-tile" href="{{ url_for('temperature') }}"><span class="menu-icon">🌡️</span>체온</a>
    <a class="menu-tile" href="{{ url_for('sleep_pattern') }}"><span class="menu-icon">🛌</span>수면 패턴</a>
    <a class="menu-tile" href="{{ url_for('live_video') }}"><span class="menu-icon">📹</span>실시간 영상</a>
    <a class="menu-tile" href="{{ url_for('sleep_record') }}"><span class="menu-icon">📋</span>수면 기록</a>
    <a class="menu-tile" href="{{ url_for('first_aid') }}"><span class="menu-icon">🚑</span>응급처치</a>
    <a class="menu-tile" href="{{ url_for('settings') }}"><span class="menu-icon">⚙️</span>설정</a>
</div>

<div class="form-footer" style="margin-bottom:20px;">
    <a href="{{ url_for('logout') }}">로그아웃</a>
</div>

<div class="danger-popup" id="danger-popup" role="alertdialog" aria-labelledby="danger-popup-title" hidden>
    <button type="button" class="danger-popup-close" id="danger-popup-close" aria-label="닫기">&times;</button>
    <div class="danger-popup-title" id="danger-popup-title">🚨 위험 상태 감지</div>
    <p>아기 상태를 바로 확인해 주세요.</p>
    <a class="danger-popup-btn" href="{{ url_for('first_aid') }}">응급처치 바로가기</a>
</div>

<script>
(function () {
    var tempValueEl = document.getElementById("home-temp-value");
    var riskDot = document.getElementById("home-risk-dot");
    var riskText = document.getElementById("home-risk-text");
    var popup = document.getElementById("danger-popup");
    var dismissed = false;

    // 위험 단계에서 팝업 표시. 닫으면 위험이 풀렸다가 다시 위험이 될 때까지 숨김
    function updateRisk(level, text) {
        riskDot.className = "dot " + level;
        riskText.textContent = text;
        if (level === "danger") {
            popup.hidden = dismissed;
        } else {
            dismissed = false;
            popup.hidden = true;
        }
    }

    document.getElementById("danger-popup-close").addEventListener("click", function () {
        dismissed = true;
        popup.hidden = true;
    });

    updateRisk("{{ risk_level }}", riskText.textContent);

    function poll() {
        fetch("{{ url_for('temperature_data') }}", { credentials: "same-origin" })
            .then(function (res) { return res.ok ? res.json() : null; })
            .then(function (data) {
                if (!data) return;
                tempValueEl.textContent = data.temp;
                updateRisk(data.risk_level, data.risk_text);
            })
            .catch(function () {});
    }

    setInterval(poll, 1000);
})();
</script>
{% endblock %}

{% extends "base.html" %}

{% block title %}비밀번호 변경{% endblock %}

{% block content %}
<div class="top-header">
    <a class="back-link" href="{{ url_for('settings_general') }}">&#8249;</a>
    <h1>비밀번호 변경</h1>
</div>

<div class="form-wrap">
    <form method="POST">
        <div class="field">
            <label for="current_password">현재 비밀번호</label>
            <div class="password-field">
                <input type="password" id="current_password" name="current_password" required>
                <span class="toggle-pw" data-target="current_password">👁️</span>
            </div>
            <a class="forgot" href="#" style="margin-top:6px;">비밀번호를 잊으셨나요?</a>
        </div>
        <div class="field">
            <label for="new_password">새 비밀번호</label>
            <div class="password-field">
                <input type="password" id="new_password" name="new_password" required>
                <span class="toggle-pw" data-target="new_password">👁️</span>
            </div>
        </div>
        <div class="field">
            <label for="confirm_password">새 비밀번호 확인</label>
            <div class="password-field">
                <input type="password" id="confirm_password" name="confirm_password" required>
                <span class="toggle-pw" data-target="confirm_password">👁️</span>
            </div>
        </div>
        <button type="submit" class="btn-primary" style="border:none;">비밀번호 변경</button>
    </form>
</div>
{% endblock %}

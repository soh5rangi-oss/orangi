{% extends "base.html" %}

{% block title %}회원 탈퇴{% endblock %}

{% block content %}
<div class="top-header">
    <a class="back-link" href="{{ url_for('settings_general') }}">&#8249;</a>
    <h1>회원 탈퇴</h1>
</div>

<div class="form-wrap">
    <form method="POST" id="withdraw-form">
        <div class="field">
            <label for="current_password">현재 비밀번호</label>
            <div class="password-field">
                <input type="password" id="current_password" name="current_password" required>
                <span class="toggle-pw" data-target="current_password">👁️</span>
            </div>
            <a class="forgot" href="#" style="margin-top:6px;">비밀번호를 잊으셨나요?</a>
        </div>
    </form>
    <button type="button" class="btn-primary" data-open-overlay="withdraw-overlay">회원 탈퇴</button>
</div>

<div class="confirm-overlay" id="withdraw-overlay">
    <div class="confirm-sheet">
        <p>정말로 탈퇴 하시겠습니까?</p>
        <div class="actions">
            <button type="button" class="btn-no" data-close-overlay>아니오</button>
            <button type="submit" form="withdraw-form" class="btn-yes">예</button>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}실시간 영상{% endblock %}

{% block content %}
<div class="top-header">
    <a class="back-link" href="{{ url_for('home') }}">&#8249;</a>
    <h1>실시간 영상</h1>
</div>

<div class="video-page">
    <div class="video-section-title">실시간 모니터링</div>
    <div class="video-box" id="live-video-box">
        <span id="live-video-placeholder">카메라 연결 대기 중</span>
        <img id="live-video-stream" alt="실시간 영상" hidden>
    </div>

    <div class="video-section-title">영상 돌려보기</div>
    <div class="slot-grid" id="video-slot-grid">
        {% for slot in slots %}
            <button type="button" class="slot-btn{% if loop.first %} selected{% endif %}" data-slot="{{ slot }}">{{ slot }}</button>
        {% endfor %}
    </div>
    <div class="video-box">저장된 영상 없음</div>
    <input class="video-scrubber" type="range" min="0" max="100" value="100">
    <div class="video-scrubber-labels">
        <span>1hr</span><span>45m</span><span>30m</span><span>15m</span><span>now</span>
    </div>
</div>

<script>
(function () {
    // 노트북의 camera_relay.py가 서버로 올리는 최신 ESP32-CAM 사진을 연속으로 받아 영상처럼 표시
    var CAPTURE_URL = "{{ url_for('camera_frame') }}";
    var RETRY_MS = 5000;

    var placeholder = document.getElementById("live-video-placeholder");
    var stream = document.getElementById("live-video-stream");

    function connect() {
        stream.src = CAPTURE_URL + "?t=" + Date.now();
    }

    placeholder.textContent = "카메라 연결 중...";

    stream.addEventListener("load", function () {
        stream.hidden = false;
        placeholder.hidden = true;
        connect();
    });

    stream.addEventListener("error", function () {
        stream.hidden = true;
        placeholder.hidden = false;
        placeholder.textContent = "카메라 연결 대기 중";
        setTimeout(connect, RETRY_MS);
    });

    connect();
})();
</script>
{% endblock %}
